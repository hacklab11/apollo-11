x-service: &service
  image: eye-system:local
  build: .
  init: true
  env_file:
    - path: .env
      required: false
  environment: &environment
    EYE_BIND_HOST: 0.0.0.0
    EYE_CORE_URL: http://eye-core:8000
    EYE_MCP_URL: http://eye-mcp:8100/mcp
  volumes:
    - ./config/compose.yaml:/app/config/settings.yaml:ro
  networks: [eye]

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 60
  start_period: 30s

services:
  sim-generate:
    <<: *service
    command: [sh, -c, 'if [ ! -s data/world.duckdb ]; then eye-sim generate --days 28 --seed 42; fi']
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - eye-data:/app/data

  sim:
    <<: *service
    command: [eye-sim, serve]
    environment:
      <<: *environment
      SIM_HOST: 0.0.0.0
      SIM_PORT: "8100"
      SIM_WORLD_DB: /app/data/world.duckdb
      SIM_LAKE_DIR: /app/data/lake
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - sim-world:/app/data
      - sim-lake:/app/data/lake
      - seller-data:/app/packages/selleros/data
    ports: ["127.0.0.1:${SIM_PORT:-8100}:8100"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]

  eye-data:
    <<: *service
    command: [eye-data]
    env_file: []
    environment:
      EYE_DATA_HOST: 0.0.0.0
      EYE_WAREHOUSE_PATH: /app/world/world.duckdb
    depends_on:
      sim-generate:
        condition: service_completed_successfully
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - eye-data:/app/world:ro
      - warehouse-data:/app/data
    networks: [warehouse]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8150/healthz', timeout=2)"]

  eye-specialists:
    <<: *service
    command: [eye-specialists]
    ports: ["127.0.0.1:${SPECIALISTS_PORT:-8200-8209}:8200"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"]

  selleros:
    <<: *service
    command: [selleros]
    environment:
      <<: *environment
      SELLEROS_URL: http://selleros:8300/
      SELLEROS_DATA_DIR: /app/packages/selleros/data
    depends_on:
      sim:
        condition: service_healthy
    volumes:
      - seller-data:/app/packages/selleros/data
    ports: ["127.0.0.1:${SELLEROS_PORT:-8300-8309}:8300"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=2)"]

  eye-core:
    <<: *service
    command: [eye-core]
    environment:
      <<: *environment
      EYE_DATA_URL: http://eye-data:8150
    depends_on:
      eye-data:
        condition: service_healthy
      eye-specialists:
        condition: service_healthy
      selleros:
        condition: service_healthy
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      # Keep the original mount for existing incident and investigation history.
      - eye-data:/app/data
    networks: [eye, warehouse]
    ports: ["127.0.0.1:${CORE_PORT:-8000-8009}:8000"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)"]

  eye-mcp:
    <<: *service
    command: [eye-mcp]
    environment:
      <<: *environment
      EYE_MCP_ALLOWED_HOSTS: eye-mcp:8100
    depends_on:
      eye-core:
        condition: service_healthy
    ports: ["127.0.0.1:${MCP_PORT:-8110-8119}:8100"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]

volumes:
  eye-data:
  warehouse-data:
  sim-world:
  sim-lake:
  seller-data:

networks:
  eye: {}
  warehouse:
    internal: true
