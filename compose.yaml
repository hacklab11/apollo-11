x-service: &service
  image: eye-system:local
  build: .
  init: true
  env_file:
    - path: .env
      required: false
  environment: &environment
    EYE_BIND_HOST: 0.0.0.0
    EYE_CORE_URL: http://eye-core:8000
    EYE_MCP_URL: http://eye-mcp:8100/mcp
    # Replay is not fail-closed: misses can call a provider. Never pass credentials.
    EYE_MODEL_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    OPENROUTER_API_KEY: ""
  volumes:
    - ./config/compose.yaml:/app/config/settings.yaml:ro
  networks: [eye]

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 60
  start_period: 30s

services:
  sim-generate:
    <<: *service
    command: [sh, -c, 'if [ ! -s data/world.duckdb ]; then eye-sim generate --days 28 --seed 42; fi']
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - eye-data:/app/data
      - seller-data:/app/packages/selleros/data

  eye-specialists:
    <<: *service
    command: [eye-specialists]
    ports: ["127.0.0.1:${SPECIALISTS_PORT:-8200}:8200"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"]

  selleros:
    <<: *service
    command: [selleros]
    environment:
      <<: *environment
      SELLEROS_URL: http://selleros:8300/
      SELLEROS_PROVIDER: openai_compatible
      SELLEROS_API_KEY_ENV: EYE_MODEL_API_KEY
      SELLEROS_DATA_DIR: /app/packages/selleros/data
    depends_on:
      sim-generate:
        condition: service_completed_successfully
    volumes:
      - seller-data:/app/packages/selleros/data
    ports: ["127.0.0.1:${SELLEROS_PORT:-8300}:8300"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=2)"]

  eye-core:
    <<: *service
    command: [eye-core]
    depends_on:
      sim-generate:
        condition: service_completed_successfully
      eye-specialists:
        condition: service_healthy
      selleros:
        condition: service_healthy
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - eye-data:/app/data
      - seller-data:/app/packages/selleros/data
    ports: ["127.0.0.1:${CORE_PORT:-8000}:8000"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)"]

  eye-mcp:
    <<: *service
    command: [eye-mcp]
    depends_on:
      eye-core:
        condition: service_healthy
    ports: ["127.0.0.1:${MCP_PORT:-8100}:8100"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]

volumes:
  eye-data:
  seller-data:

networks:
  eye:
    internal: true
