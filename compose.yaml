x-service: &service
  image: eye-system:local
  build: .
  init: true
  env_file: []
  environment: &environment
    EYE_BIND_HOST: 0.0.0.0
    EYE_CORE_URL: http://eye-core:8000
    EYE_MCP_URL: http://eye-mcp:8100/mcp
    EYE_AUTH_URL: http://auth:8500
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
  volumes:
    - ./config/compose.yaml:/app/config/settings.yaml:ro
  networks: [eye]

x-model-environment: &model-environment
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  EYE_MODEL_API_KEY: ${EYE_MODEL_API_KEY:-}

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 60
  start_period: 30s

x-agent: &agent
  <<: *service
  environment: &agent-environment
    <<: [*environment, *model-environment]
    EYE_DATA_URL: http://eye-data:8150
    HTTP_PROXY: http://egress-proxy:3128
    HTTPS_PROXY: http://egress-proxy:3128
    http_proxy: http://egress-proxy:3128
    https_proxy: http://egress-proxy:3128
    NO_PROXY: &no-proxy localhost,127.0.0.1,auth,eye-data,eye-core,eye-mcp,sentinel,detective,skeptic,reporter,cartographer,eye-specialists,selleros,lgtm
    no_proxy: *no-proxy
  depends_on: &agent-dependencies
    egress-proxy:
      condition: service_started
    auth:
      condition: service_healthy
    eye-data:
      condition: service_healthy
  networks: [agents, warehouse]
  healthcheck:
    <<: *health
    test:
      - CMD
      - python
      - -c
      - "import os, urllib.parse, urllib.request; port = urllib.parse.urlsplit(os.environ['EYE_AGENT_URL']).port; urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=2)"

services:
  auth:
    <<: *service
    networks: [eye, agents]
    command: [eye-auth]
    environment:
      EYE_BIND_HOST: 0.0.0.0
      EYE_AUTH_URL: http://auth:8500
      EYE_AUTH_KEY_PATH: /app/data/auth/key.pem
      EYE_AUTH_CONFIG: ${EYE_AUTH_CONFIG:-config/auth.yaml}
      AUTHLIB_INSECURE_TRANSPORT: "1"
      EYE_AUTH_EYE_CORE_SECRET: ${EYE_AUTH_EYE_CORE_SECRET:-}
      EYE_AUTH_SENTINEL_SECRET: ${EYE_AUTH_SENTINEL_SECRET:-}
      EYE_AUTH_DETECTIVE_SECRET: ${EYE_AUTH_DETECTIVE_SECRET:-}
      EYE_AUTH_SKEPTIC_SECRET: ${EYE_AUTH_SKEPTIC_SECRET:-}
      EYE_AUTH_REPORTER_SECRET: ${EYE_AUTH_REPORTER_SECRET:-}
      EYE_AUTH_CARTOGRAPHER_SECRET: ${EYE_AUTH_CARTOGRAPHER_SECRET:-}
      EYE_AUTH_GROWTH_SECRET: ${EYE_AUTH_GROWTH_SECRET:-}
      EYE_AUTH_MARKETPLACE_SECRET: ${EYE_AUTH_MARKETPLACE_SECRET:-}
      EYE_AUTH_DISCOVERY_SECRET: ${EYE_AUTH_DISCOVERY_SECRET:-}
      EYE_AUTH_SELLEROS_SECRET: ${EYE_AUTH_SELLEROS_SECRET:-}
      EYE_AUTH_SIM_SECRET: ${EYE_AUTH_SIM_SECRET:-}
    volumes:
      - auth-keys:/app/data/auth
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/healthz', timeout=2)"]

  lgtm:
    image: grafana/otel-lgtm:0.22.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["127.0.0.1:3000:3000"]
    networks: [eye, warehouse, agents]
    volumes:
      - ./config/grafana/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
      - ./config/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/eye.yaml:ro
      - ./config/grafana/dashboards:/otel-lgtm/eye-dashboards:ro
    healthcheck:
      <<: *health
      test: [CMD-SHELL, "curl -fsS http://localhost:3000/api/health && curl -fsS http://localhost:13133/ready"]

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ./config/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./config/squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [agents, eye]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: eye
      POSTGRES_PASSWORD: eye
      POSTGRES_DB: eye
    volumes: [control-data:/var/lib/postgresql/data]
    networks: [eye]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U eye -d eye]
      interval: 5s
      timeout: 3s
      retries: 30
  sim:
    <<: *service
    command: [eye-sim, serve]
    environment:
      <<: *environment
      OTEL_SERVICE_NAME: sim
      SIM_HOST: 0.0.0.0
      SIM_PORT: "8100"
      SIM_SECONDS_PER_SIM_HOUR:
      SIM_WORLD_DB: /app/data/world.duckdb
      SIM_LAKE_DIR: /app/data/lake
      EYE_AUTH_CLIENT_ID: sim
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_SIM_SECRET:-}
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - sim-world:/app/data
      - sim-lake:/app/data/lake
      - seller-data:/app/packages/selleros/data
    ports: ["127.0.0.1:${SIM_PORT:-8100}:8100"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]

  eye-data:
    <<: *service
    command: [eye-data]
    env_file: []
    environment:
      <<: *environment
      OTEL_SERVICE_NAME: eye-data
      EYE_DATA_HOST: 0.0.0.0
      SIM_LAKE_DIR: /app/data/lake
    depends_on:
      sim:
        condition: service_healthy
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - sim-lake:/app/data/lake:ro
      - warehouse-data:/app/data
    networks: [warehouse]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8150/healthz', timeout=2)"]

  eye-specialists:
    <<: *service
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: eye-specialists
      EYE_AUTH_GROWTH_SECRET: ${EYE_AUTH_GROWTH_SECRET:-}
      EYE_AUTH_MARKETPLACE_SECRET: ${EYE_AUTH_MARKETPLACE_SECRET:-}
      EYE_AUTH_DISCOVERY_SECRET: ${EYE_AUTH_DISCOVERY_SECRET:-}
    command: [eye-specialists]
    networks: [agents, warehouse]
    depends_on: *agent-dependencies
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2)"]

  sentinel:
    <<: *agent
    command: [eye-agent, sentinel]
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: sentinel
      EYE_AGENT_URL: http://sentinel:8210/
      EYE_AUTH_CLIENT_ID: sentinel
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_SENTINEL_SECRET:-}

  detective:
    <<: *agent
    command: [eye-agent, detective]
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: detective
      EYE_AGENT_URL: http://detective:8220/
      EYE_SKEPTIC_URL: http://skeptic:8230/
      EYE_AUTH_CLIENT_ID: detective
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_DETECTIVE_SECRET:-}
    depends_on:
      <<: *agent-dependencies
      skeptic:
        condition: service_healthy

  skeptic:
    <<: *agent
    command: [eye-agent, skeptic]
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: skeptic
      EYE_AGENT_URL: http://skeptic:8230/
      EYE_AUTH_CLIENT_ID: skeptic
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_SKEPTIC_SECRET:-}

  reporter:
    <<: *agent
    command: [eye-agent, reporter]
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: reporter
      EYE_AGENT_URL: http://reporter:8240/
      EYE_AUTH_CLIENT_ID: reporter
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_REPORTER_SECRET:-}
    depends_on:
      auth:
        condition: service_healthy
    networks: [agents]

  cartographer:
    <<: *agent
    command: [eye-agent, cartographer]
    environment:
      <<: *agent-environment
      OTEL_SERVICE_NAME: cartographer
      EYE_AGENT_URL: http://cartographer:8250/
      EYE_AUTH_CLIENT_ID: cartographer
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_CARTOGRAPHER_SECRET:-}
      SIM_LAKE_DIR: /app/data/lake
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      - sim-lake:/app/data/lake:ro

  selleros:
    <<: *service
    networks: [eye, agents]
    command: [selleros]
    environment:
      <<: [*environment, *model-environment]
      OTEL_SERVICE_NAME: selleros
      SELLEROS_URL: http://selleros:8300/
      SELLEROS_DATA_DIR: /app/packages/selleros/data
      EYE_AUTH_CLIENT_ID: selleros
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_SELLEROS_SECRET:-}
      SELLEROS_PROVIDER: ${SELLEROS_PROVIDER:-anthropic}
      SELLEROS_BASE_URL: ${SELLEROS_BASE_URL:-https://openrouter.ai/api/v1}
      SELLEROS_MODEL: ${SELLEROS_MODEL:-}
      SELLEROS_API_KEY_ENV:
    depends_on:
      auth:
        condition: service_healthy
      sim:
        condition: service_healthy
    volumes:
      - seller-data:/app/packages/selleros/data
    ports: ["127.0.0.1:${SELLEROS_PORT:-8300-8309}:8300"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=2)"]

  eye-core:
    <<: *service
    command: [eye-core]
    environment:
      <<: *environment
      OTEL_SERVICE_NAME: eye-core
      EYE_DATA_URL: http://eye-data:8150
      EYE_DATABASE_URL: postgresql://eye:eye@postgres:5432/eye
      EYE_DBOS_APPLICATION_VERSION: ${EYE_DBOS_APPLICATION_VERSION:-eye-orchestrator-v2}
      EYE_AUTH_CLIENT_ID: eye-core
      EYE_AUTH_CLIENT_SECRET: ${EYE_AUTH_EYE_CORE_SECRET:-}
      EYE_SELLER_REVERT_OPERATOR_TOKEN: ${EYE_SELLER_REVERT_OPERATOR_TOKEN:-}
      EYE_TRUST_PROXY_PERSON_HEADER: "1"
    depends_on:
      auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      detective:
        condition: service_healthy
      skeptic:
        condition: service_healthy
      reporter:
        condition: service_healthy
      cartographer:
        condition: service_healthy
      eye-data:
        condition: service_healthy
      eye-specialists:
        condition: service_healthy
      selleros:
        condition: service_healthy
    volumes:
      - ./config/compose.yaml:/app/config/settings.yaml:ro
      # Keep the original mount for existing incident and investigation history.
      - eye-data:/app/data
    networks: [eye, warehouse, agents]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)"]

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    init: true
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    networks: [eye]
    depends_on:
      eye-core:
        condition: service_healthy

  eye-mcp:
    <<: *service
    command: [eye-mcp]
    environment:
      <<: *environment
      OTEL_SERVICE_NAME: eye-mcp
      EYE_MCP_ALLOWED_HOSTS: eye-mcp:8100
    depends_on:
      eye-core:
        condition: service_healthy
    ports: ["127.0.0.1:${MCP_PORT:-8110-8119}:8100"]
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]

volumes:
  auth-keys:
  control-data:
  eye-data:
  warehouse-data:
  sim-world:
  sim-lake:
  seller-data:

networks:
  eye: {}
  agents:
    internal: true
  warehouse:
    internal: true
