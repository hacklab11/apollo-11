name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run vulture
      - run: uv run pytest -m "not live" -q
      - run: uv run python scripts/agent_evals.py --report data/eval/offline.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: npm ci
        working-directory: packages/web
      - run: npm run generate:api && git diff --exit-code -- src/lib/api.generated.ts
        working-directory: packages/web
      - run: npm run lint && npm test && npm run build
        working-directory: packages/web

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
      COMPOSE_PROJECT_NAME: eye-s8-e2e
      COMPOSE_DISABLE_ENV_FILE: '1'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --scale detective=3 && ./scripts/smoke.sh
      - run: ./scripts/e2e-s8.sh
      - run: docker compose ps
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
