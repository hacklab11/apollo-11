[project]
name = "selleros"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["anthropic==2.12.0", "a2a-sdk[http-server]==1.3.1", "httpx==0.28.1", "pydantic==2.14.4", "uvicorn==0.54.0"]

[project.scripts]
selleros = "selleros.server:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: calls the real Anthropic API"]
asyncio_default_fixture_loop_scope = "fixture-scope"
