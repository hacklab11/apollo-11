[project]
name = "eye-auth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "authlib==1.9.9",
    "a2wsgi==1.10.10",
    "flask==3.1.3",
    "fastapi==0.165.0",
    "cryptography==50.0.2",
    "a2a-sdk[signing]==1.3.1",
    "httpx==0.28.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pyyaml==6.0.4",
    "pyjwt==2.15.1",
]

[project.scripts]
eye-auth = "eye_auth.server:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"
