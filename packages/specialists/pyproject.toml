[project]
name = "eye-specialists"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "eye-auth",
    "agent-runtime",
    "a2a-sdk==1.3.1",
    "eye-contracts",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-ai-slim==2.66.0",
    "protobuf==7.36.2",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
eye-specialists = "eye.specialists.app:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye"]

[tool.uv.sources]
eye-auth = { workspace = true }
agent-runtime = { workspace = true }
eye-contracts = { workspace = true }
