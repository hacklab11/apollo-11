[project]
name = "eye-orchestrator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "eye-auth",
    "a2a-sdk==1.3.1",
    "duckdb==2.0.1",
    "dbos==3.6.0",
    "opentelemetry-api==1.45.1",
    "eye-contracts",
    "eye-data",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "protobuf==7.36.2",
    "uvicorn==0.54.0",
]

[project.scripts]
eye-core = "eye.main:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye"]

[tool.uv.sources]
eye-auth = { workspace = true }
eye-contracts = { workspace = true }
eye-data = { workspace = true }
