[project]
name = "eye-llm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agent-runtime",
    "anthropic==2.12.0",
    "eye-contracts",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-ai-slim[anthropic,openai]==2.66.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye"]

[tool.uv.sources]
agent-runtime = { workspace = true }
eye-contracts = { workspace = true }
