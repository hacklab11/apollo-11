[project]
name = "eye-data"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb==2.0.1",
    "eye-contracts",
    "networkx==3.7",
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye"]

[tool.uv.sources]
eye-contracts = { workspace = true }
