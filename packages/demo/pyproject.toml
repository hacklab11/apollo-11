[project]
name = "eye-demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["httpx==0.28.1", "pydantic==2.14.4", "typer>=0.16,<1"]

[project.scripts]
demo = "eye_demo.cli:app"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye_demo"]
