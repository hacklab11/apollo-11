[project]
name = "eye-agents"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==1.3.1",
    "duckdb==2.0.1",
    "eye-contracts",
    "eye-data",
    "eye-llm",
    "httpx==0.28.1",
    "protobuf==7.36.2",
    "pydantic==2.14.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye"]

[tool.uv.sources]
eye-contracts = { workspace = true }
eye-data = { workspace = true }
eye-llm = { workspace = true }
