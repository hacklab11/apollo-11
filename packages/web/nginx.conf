map $http_origin $expected_origin {
    default $scheme://$http_host;
    "" "";
}

server {
    listen 8080 default_server;
    server_name _;
    return 403;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1 web;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz { access_log off; return 200 'ok'; }

    location /api/ {
        # Reject cross-origin browser requests before granting local operator identity.
        # Empty Origin remains valid for host CLI and internal service callers.
        if ($http_origin != $expected_origin) { return 403; }
        proxy_pass http://eye-core:8000;
        # Single-user local deployment. Never forward a browser-supplied identity.
        # A shared deployment must replace this with its authenticated subject.
        proxy_set_header X-Eye-Person local-operator;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
