[project]
name = "agent-runtime"
version = "0.1.0"
description = "Shared agent harness: limits, end states, loop detection, kill switch, budget, fallback, retries, idempotency, tracing"
requires-python = ">=3.13"
dependencies = [
    "eye-contracts",
    "httpx==0.28.1",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.4",
    "pydantic-ai-slim==2.66.0",
    "tenacity==9.2.1",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk==1.45.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
