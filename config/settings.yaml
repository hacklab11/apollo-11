sim:
  seed: 42
  history_days: 28
  start_ts: "2026-11-27T00:00:00Z"
  seconds_per_sim_hour: 5
  autostart: true

orchestrator:
  tenant_concurrency: 1
  tenant_rate_limit: 60
  tenant_rate_period_s: 60
  max_queued_per_tenant: 100
  max_depth: 2
  max_fan_out: 3
  max_concurrent_investigations: 2
  pause_sim_during_investigation: true

sentinel:
  top_k: 10
  z_threshold: 3.0
  divergence_pp: 3.0
  min_completeness: 0.9

detective:
  max_steps: 15
  confirm_share: 0.7
  min_independent_evidence: 2

reporter:
  resolve_after_ticks: 3
  resolve_z: 2.0

llm:
  provider: anthropic # or openai_compatible
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  mode: live
  cache_path: data/llm_cache.jsonl
  prices:
    claude-opus-5-5: {input_per_mtok: 5.0, output_per_mtok: 25.0}
    nvidia/nemotron-3.5-lightning:free: {input_per_mtok: 0.0, output_per_mtok: 0.0}
    nvidia/nemotron-3-ultra-550b-a55b:free: {input_per_mtok: 0.0, output_per_mtok: 0.0}
  models:
    default: claude-opus-5-5
    # For openai_compatible: default: nvidia/nemotron-3-ultra-550b-a55b:free
  # prices:
  #   nvidia/nemotron-3-ultra-550b-a55b:free:
  #     input_per_mtok: 0.0
  #     output_per_mtok: 0.0
  effort:
    sentinel: low
    detective: high
    skeptic: medium
    reporter: medium
    cartographer: high
    specialists: medium
    chat: medium
  max_tokens: 16000
  max_calls_per_hour: 600

demo:
  show_truth: false

a2a:
  growth_url: http://localhost:8200/growth
  marketplace_url: http://localhost:8200/marketplace
  discovery_url: http://localhost:8200/discovery
  selleros_url: http://localhost:8300
  timeout_s: 60

ports:
  core: 8000
  mcp: 8100
  specialists: 8200
  selleros: 8300
