http_port 3128
acl allowed_hosts dstdomain -n "/etc/squid/allowlist.txt"
acl CONNECT method CONNECT
acl SSL_ports port 443
acl HTTP method GET HEAD POST PUT PATCH DELETE OPTIONS
http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts CONNECT
http_access allow allowed_hosts HTTP
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid
