apiVersion: 1
groups:
  - orgId: 1
    name: agent-runtime
    folder: Eye
    interval: 1m
    rules:
      - uid: eye-cost-spike
        title: Agent cost spike
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Agent cost spike exceeds the local demo threshold
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: 'sum(histogram_sum(rate(agent_cost_USD[5m])))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.01]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
      - uid: eye-loop-rate
        title: Agent loop rate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Agent loop rate exceeds the local demo threshold
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: 'sum(rate(agent_loop_detected_total[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.01]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
      - uid: eye-failure-rate
        title: Agent failure rate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Agent failure rate exceeds the local demo threshold
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: 'sum(rate(agent_end_state_total{status=~"failed|gave_up"}[5m])) / clamp_min(sum(rate(agent_end_state_total[5m])), 0.000001)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.1]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
      - uid: eye-escalation-rate
        title: Agent human escalation rate
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Agent human escalation rate exceeds the local demo threshold
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: 'sum(rate(agent_end_state_total{status="needs_input"}[5m])) / clamp_min(sum(rate(agent_end_state_total[5m])), 0.000001)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.1]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
