# Use the normal live LLM defaults; CI supplies no credentials.
sim:
  autostart: false
  seconds_per_sim_hour: 1 # demo pace: one simulated day in about a minute plus analysis time
llm:
  provider: openai_compatible # OpenRouter; key from OPENROUTER_API_KEY
  models:
    default: deepseek/deepseek-v4-pro
  prices: # OpenRouter list price, 2026-11-22
    deepseek/deepseek-v4-pro: {input_per_mtok: 0.9, output_per_mtok: 1.5}
orchestrator:
  tenant_concurrency: 1
  tenant_rate_limit: 60
  tenant_rate_period_s: 60
  max_queued_per_tenant: 100
  max_depth: 2
  max_fan_out: 3
a2a:
  sentinel_url: http://sentinel:8210/
  detective_url: http://detective:8220/
  skeptic_url: http://skeptic:8230/
  reporter_url: http://reporter:8240/
  cartographer_url: http://cartographer:8250/
  growth_url: http://eye-specialists:8200/growth
  marketplace_url: http://eye-specialists:8200/marketplace
  discovery_url: http://eye-specialists:8200/discovery
  selleros_url: http://selleros:8300
