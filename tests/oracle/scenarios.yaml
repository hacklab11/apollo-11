  run_hours: 24
  on_incident_open: add_metric(fee_per_order)
  on_selleros_ack: clear(S8)
  expect:
    <<: &S8_expect
      entry_metrics_any: [aov, first_party_margin, price_change_rate, contribution_margin]
      verdict_any: [CONFIRMED]
      root_node_any: [aov, price_change_rate]
      cause_type: price_change
      segment_contains: {category: [electronics]}
      must_mention: [price, coupon, planned, SellerOS]
