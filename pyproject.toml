[project]
name = "eye"
version = "0.1.0"
description = "Agentic monitoring for a simulated marketplace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent-runtime",
    "eye-contracts",
    "eye-data",
    "eye-llm",
    "eye-agents",
    "eye-orchestrator",
    "eye-specialists",
    "eye-mcp",
    "eye-sim",
    "selleros",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk==1.45.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
    "import-linter==2.11",
]

[tool.pytest.ini_options]
markers = ["live: calls the real Anthropic API"]
asyncio_default_fixture_loop_scope = "fixture-scope"

[tool.ruff]
extend-exclude = ["docs"]
src = ["packages/*/src", "packages/selleros", "sim/src"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "sim"]

[tool.uv.sources]
agent-runtime = { workspace = true }
eye-contracts = { workspace = true }
eye-data = { workspace = true }
eye-llm = { workspace = true }
eye-agents = { workspace = true }
eye-orchestrator = { workspace = true }
eye-specialists = { workspace = true }
eye-mcp = { workspace = true }
eye-sim = { workspace = true }
selleros = { workspace = true }

[tool.importlinter]
root_packages = ["eye", "selleros", "agent_runtime"]

[[tool.importlinter.contracts]]
name = "Agent runtime does not import application packages"
type = "forbidden"
source_modules = ["agent_runtime"]
forbidden_modules = [
    "eye.contracts",
    "eye.config",
    "eye.schema",
    "eye.registry",
    "eye.graph",
    "eye.tools",
    "eye.llm",
    "eye.agents",
    "eye.specialists",
    "eye.orchestrator",
    "eye.incidents",
    "eye.api",
    "eye.a2a_client",
    "eye.datasource",
    "eye.main",
    "eye.mcp_server",
    "eye.sim",
    "selleros",
]
ignore_imports = ["eye.contracts_v2 -> eye.contracts"]

[[tool.importlinter.contracts]]
name = "Contracts import nothing in the workspace"
type = "forbidden"
source_modules = ["eye.contracts", "eye.contracts_v2"]
forbidden_modules = [
    "eye.config",
    "eye.schema",
    "eye.registry",
    "eye.graph",
    "eye.tools",
    "eye.llm",
    "eye.agents",
    "eye.specialists",
    "eye.orchestrator",
    "eye.incidents",
    "eye.api",
    "eye.a2a_client",
    "eye.datasource",
    "eye.main",
    "eye.mcp_server",
    "eye.sim",
    "agent_runtime",
    "selleros",
]

[[tool.importlinter.contracts]]
name = "Production does not import simulator"
type = "forbidden"
source_modules = [
    "eye.contracts",
    "eye.contracts_v2",
    "eye.config",
    "eye.schema",
    "eye.registry",
    "eye.graph",
    "eye.tools",
    "eye.warehouse",
    "eye.llm",
    "eye.agents",
    "eye.specialists",
    "eye.orchestrator",
    "eye.incidents",
    "eye.api",
    "eye.a2a_client",
    "eye.datasource",
    "eye.main",
    "eye.mcp_server",
    "selleros",
]
forbidden_modules = [
    "eye.sim",
]

[[tool.importlinter.contracts]]
name = "Contracts and config are foundational"
type = "forbidden"
source_modules = [
    "eye.contracts",
    "eye.contracts_v2",
    "eye.config",
]
forbidden_modules = [
    "eye.schema",
    "eye.registry",
    "eye.graph",
    "eye.tools",
    "eye.warehouse",
    "eye.llm",
    "eye.agents",
    "eye.specialists",
    "eye.orchestrator",
    "eye.incidents",
    "eye.api",
    "eye.a2a_client",
    "eye.datasource",
    "eye.main",
    "eye.mcp_server",
    "eye.sim",
]

[[tool.importlinter.contracts]]
name = "Contracts and config do not import one another"
type = "independence"
modules = ["eye.contracts", "eye.config"]

[[tool.importlinter.contracts]]
name = "Contracts v2 and config do not import one another"
type = "independence"
modules = ["eye.contracts_v2", "eye.config"]

[[tool.importlinter.contracts]]
name = "Data and LLM stay below agents and orchestration"
type = "forbidden"
source_modules = [
    "eye.schema",
    "eye.registry",
    "eye.graph",
    "eye.tools",
    "eye.warehouse",
    "eye.llm",
]
forbidden_modules = [
    "eye.agents",
    "eye.specialists",
    "eye.orchestrator",
    "eye.incidents",
    "eye.api",
    "eye.datasource",
    "eye.main",
    "eye.mcp_server",
]

[[tool.importlinter.contracts]]
name = "Agents and specialists do not import orchestration"
type = "forbidden"
source_modules = [
    "eye.agents",
    "eye.specialists",
]
forbidden_modules = [
    "eye.orchestrator",
    "eye.incidents",
    "eye.api",
    "eye.datasource",
    "eye.main",
    "eye.mcp_server",
]

[[tool.importlinter.contracts]]
name = "Core agents are independent"
type = "independence"
modules = [
    "eye.agents.sentinel",
    "eye.agents.detective",
    "eye.agents.skeptic",
    "eye.agents.reporter",
    "eye.agents.cartographer",
]
ignore_imports = [
    "eye.agents.detective -> eye.agents.skeptic", # wave 3 removes this existing edge
]

[[tool.importlinter.contracts]]
name = "SellerOS is independent"
type = "independence"
modules = [
    "selleros",
    "eye",
]
