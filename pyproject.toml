[project]
name = "eye"
version = "0.1.0"
description = "Agentic monitoring for a simulated marketplace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==1.3.1",
    "anthropic==2.12.0",
    "duckdb==2.0.1",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "networkx==3.7",
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
    # Windows ships no IANA tz database; DuckDB needs it for Europe/Berlin.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn==0.54.0",
]

[project.scripts]
eye-core = "eye.main:main"
eye-sim = "eye.sim.cli:main"
eye-specialists = "eye.specialists.app:main"
eye-mcp = "eye.mcp_server:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: calls the real Anthropic API"]
asyncio_default_fixture_loop_scope = "fixture-scope"

[tool.ruff]
extend-exclude = ["docs"]
